<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19161D"/>
      <stop offset="55%" stop-color="#221C26"/>
      <stop offset="100%" stop-color="#2D2024"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D7B270" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#E7C98A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#D7B270" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="vermilion" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D44A3B"/>
      <stop offset="100%" stop-color="#9E2A22"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F6E5BD" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#D7B270" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#D7B270" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 底板 -->
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <!-- 内框细金线 -->
  <rect x="16" y="16" width="1168" height="228" rx="12" fill="none" stroke="#D7B270" stroke-opacity="0.26" stroke-width="1.2"/>
  <rect x="22" y="22" width="1156" height="216" rx="9" fill="none" stroke="#D7B270" stroke-opacity="0.12" stroke-width="0.8"/>

  <!-- 右侧满月光晕与几何折纹 -->
  <circle cx="995" cy="130" r="130" fill="url(#moon)"/>
  <circle cx="995" cy="130" r="68" fill="none" stroke="#E7C98A" stroke-opacity="0.25" stroke-width="1.4"/>
  <circle cx="995" cy="130" r="52" fill="none" stroke="#E7C98A" stroke-opacity="0.16" stroke-width="1" stroke-dasharray="4 6"/>
  <!-- 抽象鸟居剪影 -->
  <g transform="translate(940, 82)" stroke="#E7C98A" stroke-opacity="0.34" stroke-width="2.2" fill="none" stroke-linecap="round">
    <path d="M 0 18 Q 55 4 110 18"/>
    <line x1="12" y1="32" x2="98" y2="32"/>
    <line x1="26" y1="16" x2="22" y2="92"/>
    <line x1="84" y1="16" x2="88" y2="92"/>
    <line x1="55" y1="14" x2="55" y2="32"/>
  </g>

  <!-- 左侧朱砂竖印 -->
  <g transform="translate(64, 58)">
    <rect width="58" height="144" rx="8" fill="url(#vermilion)" stroke="#F2D7A4" stroke-opacity="0.45" stroke-width="1.2"/>
    <rect x="5" y="5" width="48" height="134" rx="5" fill="none" stroke="#F8E9CE" stroke-opacity="0.38" stroke-width="0.9"/>
    <text x="29" y="45" text-anchor="middle" fill="#FAF0DC" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700">平</text>
    <text x="29" y="79" text-anchor="middle" fill="#FAF0DC" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700">安</text>
    <text x="29" y="113" text-anchor="middle" fill="#FAF0DC" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="22" font-weight="700">双</text>
    <text x="29" y="136" text-anchor="middle" fill="#F2D7A4" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13" font-weight="600">端</text>
  </g>

  <!-- 主标题与副标题 -->
  <text x="152" y="102" fill="#F7EFE2" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="36" font-weight="700" letter-spacing="2">
    OnmyojiAutoScript · 双端一体化仓库
  </text>
  <rect x="152" y="120" width="540" height="1.5" fill="url(#gold)"/>
  <text x="152" y="152" fill="#D9CBB6" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="17" letter-spacing="1">
    Windows 桌面端整合版 (desktop/)  ×  Android 免 Root 虚拟屏独立运行版 (mobile/)
  </text>

  <!-- 底部极简信息胶囊 -->
  <g transform="translate(152, 178)" font-family="PingFang SC, Microsoft YaHei, Noto Sans SC, sans-serif" font-size="13">
    <rect x="0" y="0" width="142" height="28" rx="14" fill="#2F2633" stroke="#D7B270" stroke-opacity="0.45"/>
    <text x="71" y="19" text-anchor="middle" fill="#EAD7B0">Python 3.10 核心同源</text>

    <rect x="156" y="0" width="164" height="28" rx="14" fill="#2F2633" stroke="#D7B270" stroke-opacity="0.45"/>
    <text x="238" y="19" text-anchor="middle" fill="#EAD7B0">Shizuku 后台独立虚拟屏</text>

    <rect x="334" y="0" width="146" height="28" rx="14" fill="#2F2633" stroke="#D7B270" stroke-opacity="0.45"/>
    <text x="407" y="19" text-anchor="middle" fill="#EAD7B0">Flutter + Kotlin 原生壳</text>

    <rect x="494" y="0" width="106" height="28" rx="14" fill="#3B2326" stroke="#D44A3B" stroke-opacity="0.65"/>
    <text x="547" y="19" text-anchor="middle" fill="#F4C4BE">GPL-3.0 开源</text>
  </g>
</svg>
