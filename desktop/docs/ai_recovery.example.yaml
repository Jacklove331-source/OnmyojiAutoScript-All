# OAS AI 智能自愈层配置（DeepSeek）
# 本文件被 .gitignore 覆盖，不会提交；密钥请放在环境变量 DEEPSEEK_API_KEY
# 或同目录 ai_recovery.key（单行，勿提交）。
enabled: false
mode: observe        # observe=只分析不点击；auto=允许执行安全动作
api:
  base_url: https://api.deepseek.com
  model: deepseek-flash
  reasoning_effort: low   # low 更省 token；疑难界面可临时改 high
  timeout_s: 75
  max_retries: 2
  max_tokens: 900
  image_max_side: 960
  image_quality: 68
  send_full_screen: true
budget:
  per_incident_calls: 2
  per_hour_calls: 12
  per_day_calls: 60
  per_day_cny: 3.0
detector:
  stale_frame_s: 90
  unknown_page_s: 45
  repeated_click_n: 4
  cooldown_s: 180
safety:
  max_actions: 4
  max_click_per_point: 2
  min_confidence: 0.6
knowledge:
  enabled: false
templates:
  enabled: false
  auto_apply_to_source: false

